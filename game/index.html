<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Космический Разведчик</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            overflow: hidden;
            touch-action: none;
            width: 100vw;
            height: 100vh;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Service Panel - Dashboard Style */
        .service-panel {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(180deg, rgba(20, 30, 50, 0.95) 0%, rgba(10, 15, 25, 0.9) 100%);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            z-index: 1000;
            border-bottom: 1px solid rgba(100, 150, 255, 0.3);
        }

        .panel-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-left {
            flex: 0 0 auto;
        }

        .panel-center {
            flex: 1;
            justify-content: center;
            text-align: center;
        }

        .panel-right {
            flex: 0 0 auto;
        }

        .btn-service {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: linear-gradient(135deg, rgba(100, 150, 255, 0.2) 0%, rgba(50, 100, 200, 0.3) 100%);
            border: 1px solid rgba(100, 150, 255, 0.4);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s ease;
        }

        .btn-service:hover {
            background: linear-gradient(135deg, rgba(100, 150, 255, 0.4) 0%, rgba(50, 100, 200, 0.5) 100%);
            transform: scale(1.05);
        }

        .btn-service:active {
            transform: scale(0.95);
        }

        .btn-round {
            border-radius: 50%;
        }

        .center-info {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(100, 150, 255, 0.8);
        }

        /* Game Info Panel */
        .game-info-panel {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(180deg, rgba(30, 40, 60, 0.9) 0%, rgba(15, 20, 35, 0.85) 100%);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 8px 20px;
            display: flex;
            gap: 20px;
            z-index: 999;
            border: 1px solid rgba(100, 150, 255, 0.2);
        }

        .info-item {
            color: #a0c0ff;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .info-value {
            color: #fff;
            font-weight: 700;
            font-size: 16px;
        }

        /* Mobile Controls */
        .mobile-controls {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: none;
            z-index: 998;
        }

        .btn-main {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);
            border: 3px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
            transition: all 0.15s ease;
        }

        .btn-main:active {
            transform: scale(0.9);
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.3);
        }

        .btn-secondary {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(100, 150, 255, 0.3) 0%, rgba(50, 100, 200, 0.4) 100%);
            border: 2px solid rgba(100, 150, 255, 0.5);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            position: absolute;
            box-shadow: 0 3px 10px rgba(50, 100, 200, 0.3);
        }

        .btn-boost {
            bottom: 80px;
            right: 10px;
        }

        .btn-brake {
            bottom: 10px;
            right: 80px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(20, 30, 50, 0.98) 0%, rgba(10, 15, 25, 0.95) 100%);
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(100, 150, 255, 0.3);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .modal-title {
            color: #fff;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-body {
            color: #a0c0ff;
            line-height: 1.6;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(100, 150, 255, 0.2);
        }

        .stat-label {
            color: #80a0d0;
        }

        .stat-value {
            color: #fff;
            font-weight: 600;
        }

        .btn-close {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .service-panel {
                height: 50px;
                padding: 0 10px;
            }

            .btn-service {
                width: 35px;
                height: 35px;
                font-size: 16px;
            }

            .center-info {
                font-size: 14px;
            }

            .game-info-panel {
                top: 50px;
                padding: 6px 15px;
                gap: 15px;
            }

            .info-item {
                font-size: 12px;
            }

            .info-value {
                font-size: 14px;
            }

            .mobile-controls {
                bottom: 20px;
                right: 20px;
            }

            .btn-main {
                width: 60px;
                height: 60px;
            }

            .btn-secondary {
                width: 45px;
                height: 45px;
            }
        }

        @media (max-width: 320px) {
            .service-panel {
                height: 45px;
                padding: 0 8px;
            }

            .btn-service {
                width: 30px;
                height: 30px;
                font-size: 14px;
            }

            .center-info {
                font-size: 12px;
            }

            .game-info-panel {
                display: none;
            }
        }

        /* PC Controls Info */
        .pc-controls-hint {
            position: fixed;
            bottom: 10px;
            left: 10px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            z-index: 997;
        }

        @media (max-width: 768px) {
            .pc-controls-hint {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Service Panel -->
    <div class="service-panel">
        <div class="panel-section panel-left">
            <button class="btn-service btn-round" id="btnProfile" title="Профиль">👤</button>
            <button class="btn-service btn-round" id="btnShare" title="Поделиться">🔗</button>
        </div>
        <div class="panel-section panel-center">
            <div class="center-info" id="centerInfo">Время: 00:00</div>
        </div>
        <div class="panel-section panel-right">
            <button class="btn-service btn-round" id="btnSound" title="Звук">🔊</button>
            <button class="btn-service btn-round" id="btnFullscreen" title="Полный экран">⛶</button>
            <button class="btn-service btn-round" id="btnRestart" title="Перезапуск">↻</button>
        </div>
    </div>

    <!-- Game Info Panel -->
    <div class="game-info-panel">
        <div class="info-item">Счет: <span class="info-value" id="scoreValue">0</span></div>
        <div class="info-item">Ракеты: <span class="info-value" id="rocketsValue">0</span></div>
        <div class="info-item">Жизни: <span class="info-value" id="livesValue">3</span></div>
    </div>

    <!-- Mobile Controls -->
    <div class="mobile-controls" id="mobileControls">
        <button class="btn-secondary btn-boost" id="btnBoost">⚡</button>
        <button class="btn-secondary btn-brake" id="btnBrake">🛑</button>
        <button class="btn-main" id="btnFire">🎯</button>
    </div>

    <!-- PC Controls Hint -->
    <div class="pc-controls-hint">WASD/Стрелки - Движение | Пробел - Ускорение | Shift - Тормоз</div>

    <!-- Profile Modal -->
    <div class="modal" id="profileModal">
        <div class="modal-content">
            <h2 class="modal-title">Профиль Игрока</h2>
            <div class="modal-body">
                <div class="stat-row">
                    <span class="stat-label">Игровая валюта:</span>
                    <span class="stat-value" id="currencyValue">0 💎</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Лучший счет:</span>
                    <span class="stat-value" id="bestScoreValue">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Всего игр:</span>
                    <span class="stat-value" id="totalGamesValue">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Уничтожено ракет:</span>
                    <span class="stat-value" id="destroyedRocketsValue">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Хранение данных:</span>
                    <span class="stat-value" id="storageStatus">Локальное</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Последнее сохранение:</span>
                    <span class="stat-value" id="lastSaveValue">-</span>
                </div>
                <div class="stat-row" style="margin-top: 20px; border: none;">
                    <span class="stat-label">Рейтинг игроков:</span>
                    <span class="stat-value">🏆 Загрузка...</span>
                </div>
            </div>
            <button class="btn-close" onclick="closeModal('profileModal')">Закрыть</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script src="game.js"></script>
</body>
</html>
